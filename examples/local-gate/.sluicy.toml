# A repository whose checks used to run in GitHub Actions, now gated on this machine by sluicy.
# Copy this directory's .githooks/, scripts/ci.sh and this file into the repository, then edit.
project = "myapp"

# The host (Vercel, Netlify, Cloudflare Pages) builds every push to main. If a workflow deployed for you
# (`vercel deploy --prod` in a cd.yml), use kind = "command" with that command instead.
[deploy]
kind = "none"

[gate]
waivers = ["SKIP_BUILD"]
# Settings the gate needs on every machine. Tool paths live in scripts/toolchain.sh, which [deps] and
# [init] use too. Per-OS values can go in env_linux / env_darwin (merged over `env` on that OS only).
env = { TZ = "America/Chicago" }
mem_reserve_gb = 4

[deps]
"package-lock.json" = ["bash", "scripts/install.sh"]

[init]
copy_files = [".env.local"]
install = [{ dir = ".", command = ["bash", "scripts/install.sh"] }]
