[package]
name = "sluicy-deck"
version = "0.2.0"
edition = "2021"
# The laptop's toolchain. ratatui 0.30+ needs a newer rustc, hence the pins below.
rust-version = "1.85"
# Rust-version-aware resolution: pick dependency versions that build on rust-version.
resolver = "3"
description = "Session Deck: concurrent Claude sessions, the sluicy queue and the laptop, in a terminal or a local page"
publish = false
license = "MIT"

[[bin]]
name = "deck"
path = "src/main.rs"

[dependencies]
libc = "0.2.169"
serde_json = "1.0.135"
rusqlite = { version = "0.30.0", features = ["bundled"] }
# The terminal front end (`deck tui`); crossterm comes through `ratatui::crossterm`.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }

# No LTO and the default codegen units: a rebuild after a deck change takes ~5 s instead of ~30 s
# (fat LTO on one unit), for the same binary size. deck.sh rebuilds before it starts.
[profile.release]
opt-level = 3
strip = true
